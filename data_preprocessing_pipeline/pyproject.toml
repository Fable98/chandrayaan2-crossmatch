[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-pipeline"
version = "0.1.0"
description = "Chandrayaan-2 PDS4 ingest, photometric/geometric normalization, and tile export for ML matching."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "rasterio>=1.3",
  "affine>=2.4",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.22",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pandas>=2.0",
  "shapely>=2.0",
  "geopandas>=0.14",
]

[project.optional-dependencies]
spice = ["spiceypy>=1.3"]
dev = ["pytest>=7.4"]

[project.scripts]
lunar-prep = "lunar_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["lunar_pipeline*"]
