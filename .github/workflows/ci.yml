name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must track the pinned dependency era: requirements.txt pins 2026-era
      # wheels (tifffile==2026.8.23, …) with no Python 3.11 distribution, so a
      # 3.11 runner fails at `pip install` before a single test runs. 3.14 is
      # the locally verified interpreter (see pip freeze audit in PR).
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgdal-dev \
            gdal-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned: unpinned httpx/pytest drift reds the tree without any code
          # change (a httpx major bump breaks starlette TestClient). These pins
          # match the locally verified environment.
          pip install "pytest==9.1.1" "pytest-asyncio==1.4.0" "httpx==0.28.1"

      - name: Run Pytest suite
        env:
          GLOBAL_SEED: 42
        run: |
          pytest -v

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: lunar-frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix lunar-frontend ci

      - name: Build Next.js console
        run: |
          npm --prefix lunar-frontend run build
