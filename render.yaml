services:
  - type: web
    name: chandrayaan2-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    # Backend only; the frontend deploys separately (see ALLOWED_ORIGINS
    # Vercel URL below and lunar-frontend/Dockerfile for self-host).
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: ALLOWED_ORIGINS
        value: "https://chandrayaan2-crossmatch-56fjycajj-fable98s-projects.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: MAX_INGEST_FILE_MB
        value: 1024
      - key: MAX_INGEST_TOTAL_MB
        value: 3072
